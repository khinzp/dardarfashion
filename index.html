<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dar Dar Fashion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Mobile top bar -->
  <header class="topbar">
    <button id="menuBtn" class="menu-btn" aria-label="Menu">☰</button>
    <h1 class="brand">🧵 Dar Dar Fashion</h1>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="brand-wrap">
        <span class="brand-icon">🧵</span>
        <span class="brand-name">Dar Dar Fashion</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-page="dashboard">📊 Dashboard</button>
        <button class="nav-item" data-page="customers">👥 Customers</button>
        <button class="nav-item" data-page="measurements">📏 Measurements</button>
        <button class="nav-item" data-page="orders">🧾 Orders</button>
        <button class="nav-item" data-page="payments">💰 Payments</button>
        <button class="nav-item" data-page="expenses">📉 Expenses</button>
        <button class="nav-item" data-page="reports">📈 Reports</button>
      </nav>
    </aside>

    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay"></div>

    <!-- Main content -->
    <main class="content" id="content">
      <!-- Pages rendered by JS -->
    </main>
  </div>

  <!-- Modal container -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 id="modalTitle">Title</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
